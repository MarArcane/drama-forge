<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11111a">
<meta name="description" content="A mobile-first AI drama studio prototype for creating stories, characters, episodes, and scene plans.">
<link rel="manifest" href="manifest.json">
<title>DramaForge Studio</title>
<style>
:root{--bg:#0e0e16;--panel:#171722;--panel2:#20202d;--text:#f5f4fa;--muted:#aaa9bd;--line:#303043;--accent:#b9a2ff;--accent2:#f4b4d8;--good:#a8e6c1;--danger:#ffb4b4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#30234c 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:900px;margin:auto;min-height:100dvh;padding:0 15px 100px}
header{padding:22px 2px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;gap:11px;align-items:center}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#c3a7ff,#ffb9dc);display:grid;place-items:center;color:#171222;font-size:23px;font-weight:900}
h1{font-size:20px;margin:0;letter-spacing:-.5px}header p{margin:2px 0 0;color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 10px;font-size:11px;white-space:nowrap}
.hero{padding:22px;border:1px solid #3a3151;border-radius:22px;background:linear-gradient(130deg,#211a34,#171722 70%);margin-bottom:18px}
.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
.hero h2{font-size:27px;line-height:1.1;margin:10px 0}.hero p{color:#c5c2d6;margin:0 0 17px;max-width:580px}
.primary,.secondary,.ghost,.danger{border:0;border-radius:12px;padding:12px 15px;font-weight:750}
.primary{background:var(--accent);color:#171222}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.danger{background:#47232c;color:#ffd9df}
button:active{transform:scale(.985)}.actions{display:flex;gap:9px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 23px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px}.stat strong{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:23px 0 12px}.section-head h3{margin:0;font-size:17px}.section-head small{color:var(--muted)}
.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:10px max(12px,calc((100vw - 870px)/2)) calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#101019ed;backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{background:transparent;border:0;color:var(--muted);padding:8px 2px;border-radius:11px;font-size:11px}.tab span{display:block;font-size:19px;margin-bottom:2px}.tab.active{background:#29223a;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;min-width:0}.card h4{margin:0 0 7px;font-size:15px}.card p{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.card .meta{font-size:11px;color:var(--accent);margin-bottom:8px}.card-actions{display:flex;gap:7px;margin-top:13px}.card-actions button{flex:1;padding:9px 7px;font-size:12px}
form{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{color:#d4d1e2;font-size:12px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#101019;color:var(--text);padding:12px;border-radius:11px;outline:none}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:12px 13px;background:#1d2b26;border:1px solid #304d40;color:#c9f1d9;border-radius:12px;font-size:12px}.warning{background:#2d261a;border-color:#51422b;color:#f4dfad}

.genre-picker{border:1px solid var(--line);background:#11111b;border-radius:13px;padding:12px}
.genre-tools{display:grid;gap:8px;margin-bottom:10px}
.genre-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:230px;overflow:auto;padding:2px}
.genre-option{display:flex;align-items:center;gap:7px;padding:8px;background:#1b1b28;border:1px solid #303043;border-radius:9px;font-size:12px;color:#e8e5f2}
.genre-option input{width:auto;accent-color:#b9a2ff}
.genre-selected{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.genre-chip{background:#302743;color:#d9caff;border:1px solid #51416f;border-radius:99px;padding:5px 9px;font-size:11px}
.genre-help{font-size:11px;color:var(--muted);margin:6px 0 0}
.episode-row{display:flex;gap:9px;align-items:flex-start}.episode-row .ep-main{flex:1;min-width:0}.episode-row .ep-main p{font-size:12px;color:var(--muted);margin:4px 0}.mini-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.mini-actions button{padding:7px 9px;font-size:11px}.season-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.season-head h4{margin:0}.muted{color:var(--muted);font-size:12px}
@media(max-width:380px){.genre-list{grid-template-columns:1fr}}

.empty{padding:28px 18px;text-align:center;border:1px dashed #454257;border-radius:17px;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:5px}
.output{white-space:pre-wrap;overflow-wrap:anywhere;background:#101019;border:1px solid var(--line);border-radius:13px;padding:15px;font-size:13px;line-height:1.65;max-height:none}
.list{display:grid;gap:10px}.project{display:flex;align-items:flex-start;gap:12px}.project-icon{width:43px;height:48px;flex-shrink:0;border-radius:11px;background:linear-gradient(145deg,#302543,#20202d);display:grid;place-items:center;font-size:20px}.project-main{flex:1;min-width:0}.project-main h4{margin:0 0 4px}.project-main p{margin:0;color:var(--muted);font-size:12px}.tag{display:inline-block;margin-top:8px;padding:4px 7px;border-radius:7px;background:#29223a;color:var(--accent);font-size:10px}
.modal{position:fixed;z-index:10;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;padding:14px}.modal.show{display:flex}.sheet{width:min(100%,700px);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheet-head h3{margin:0}.close{background:transparent;color:var(--muted);border:0;font-size:25px}
footer{color:#77768a;text-align:center;font-size:11px;margin-top:24px}
@media(min-width:650px){.app{padding-left:24px;padding-right:24px}.hero{padding:28px}.hero h2{font-size:34px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tabs{position:static;margin:10px 0 20px;border:1px solid var(--line);border-radius:15px;padding:7px;background:#15151f}.tab{font-size:12px}.tab span{display:inline;margin-right:7px}.modal{align-items:center}}
@media(max-width:380px){.grid{grid-template-columns:1fr}.hero h2{font-size:24px}.pill{display:none}.two{grid-template-columns:1fr}}
.bible-entry{background:#1b1b28;border:1px solid var(--line);border-radius:12px;padding:11px;margin:7px 0}.bible-entry h4{margin:0 0 5px}.bible-entry p{margin:0;color:var(--muted);font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">▶</div><div><h1>DramaForge</h1><p>Mobile AI drama studio · Prototype</p></div></div>
  <span class="pill">BETA · LOCAL SAVE</span>
</header>
<nav class="tabs" aria-label="Main navigation">
  <button class="tab active" data-page="home"><span>⌂</span>Home</button>
  <button class="tab" data-page="projects"><span>▣</span>Projects</button>
  <button class="tab" data-page="create"><span>✦</span>Create</button>
  <button class="tab" data-page="bible"><span>✧</span>Bible</button>
  <button class="tab" data-page="library"><span>☷</span>Library</button>
</nav>
<main id="main"></main>
<footer>Prototype 0.5 · Story Bible and Worldbuilding · Your saved projects stay on this device. Generated text is a starter draft, not a connected AI model yet.</footer>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sheet-head"><h3 id="modalTitle">Details</h3><button class="close" id="closeModal" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='dramaforge_projects_v1';
const APP_VERSION='0.4';
const $=s=>document.querySelector(s);
let page='home', activeProject=null, episodeLimit=50;
let projects=[];
try{projects=JSON.parse(localStorage.getItem(KEY)||'[]');projects=projects.map(p=>({...p,genres:Array.isArray(p.genres)&&p.genres.length?p.genres:(p.genre?[p.genre]:['Drama']),primaryGenre:p.primaryGenre||p.genre||'Drama'}))}catch(e){projects=[]}
const genres=['Romance','Romantic Comedy','Erotic Romance (adult characters)','Erotic Drama (adult characters)','Revenge','Fantasy','Dark Fantasy','Urban Fantasy','High Fantasy','Horror','Gothic Horror','Psychological Thriller','Thriller','Mystery','Cozy Mystery','Crime','Detective','Comedy','Satire','Melodrama','Action','Sci-fi','Cyberpunk','Dystopian','Post-Apocalyptic','Historical Drama','Mythology','Superhero','Political Intrigue','Survival','Medical Drama','Legal Drama','Sports Drama','Slice of Life','Found Family','Cultivation / Xianxia','Wuxia / Martial Arts','Xuanhuan','Isekai / Otherworld','Reincarnation','Regression / Time Loop','Transmigration','LitRPG / System','Dungeon / Tower','GameLit','Otome / Villainess','Gender Bender','Body Swap','BL / Boys’ Love','GL / Girls’ Love','Harem','Reverse Harem','Paranormal Romance','Supernatural','Coming of Age','Family Saga','Workplace Drama','War Drama','Adventure'];
const moods=['Emotional','Dark','Hopeful','Chaotic','Suspenseful','Funny','Epic','Gritty'];

function genrePickerMarkup(prefix, selected, primary){
 const chosen=Array.isArray(selected)&&selected.length?selected:(selected?[selected]:[]);
 const all=[...new Set([...genres,...chosen])];
 return `<div class="genre-picker" id="${prefix}Picker">
  <div class="genre-tools">
   <input id="${prefix}Search" type="search" placeholder="Search genres…" aria-label="Search genres">
   <div class="two"><input id="${prefix}Custom" type="text" maxlength="50" placeholder="Add your own genre"><button type="button" class="secondary" id="${prefix}Add">＋ Add genre</button></div>
  </div>
  <div class="genre-list" id="${prefix}List">${all.map(g=>`<label class="genre-option" data-genre="${esc(g.toLowerCase())}"><input type="checkbox" value="${esc(g)}" ${chosen.includes(g)?'checked':''}>${esc(g)}</label>`).join('')}</div>
  <div class="genre-selected" id="${prefix}Chips"></div>
  <div class="field"><label for="${prefix}Primary">Primary genre</label><select id="${prefix}Primary"><option value="${esc(primary||chosen[0]||"")}" selected>${esc(primary||chosen[0]||"")}</option></select></div>
  <p class="genre-help">Select unlimited genres. Your primary genre leads the story; the others add flavor and subplots.</p>
 </div>`;
}
function bindGenrePicker(prefix){
 const list=document.getElementById(prefix+'List');if(!list)return;
 const search=document.getElementById(prefix+'Search'),custom=document.getElementById(prefix+'Custom'),add=document.getElementById(prefix+'Add'),primary=document.getElementById(prefix+'Primary');
 const refresh=()=>{
  const selected=[...list.querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value), previous=primary.value;
  primary.innerHTML=selected.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  if(selected.includes(previous))primary.value=previous;else if(selected.length)primary.value=selected[0];
  document.getElementById(prefix+'Chips').innerHTML=selected.map(g=>`<span class="genre-chip">${esc(g)}${g===primary.value?' ★':''}</span>`).join('');
 };
 list.addEventListener('change',refresh);
 primary.addEventListener('change',refresh);
 search.addEventListener('input',()=>{
  const q=search.value.trim().toLowerCase();
  list.querySelectorAll('.genre-option').forEach(label=>label.style.display=label.dataset.genre.includes(q)?'flex':'none');
 });
 add.addEventListener('click',()=>{
  const value=custom.value.trim();if(!value)return;
  let checkbox=[...list.querySelectorAll('input[type="checkbox"]')].find(x=>x.value.toLowerCase()===value.toLowerCase());
  if(!checkbox){
   const label=document.createElement('label');label.className='genre-option';label.dataset.genre=value.toLowerCase();
   checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=value;checkbox.checked=true;
   label.append(checkbox,document.createTextNode(value));list.appendChild(label);
  }else checkbox.checked=true;
  custom.value='';refresh();
 });
 refresh();
}
function getGenreSelection(prefix){
 const list=document.getElementById(prefix+'List');
 const selected=list?[...list.querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value):[];
 const primary=document.getElementById(prefix+'Primary');
 return {selected,primary:primary&&selected.includes(primary.value)?primary.value:(selected[0]||'Drama')};
}

function save(){localStorage.setItem(KEY,JSON.stringify(projects))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(t){return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function projectGenres(p){return Array.isArray(p.genres)&&p.genres.length?p.genres:(p.genre?[p.genre]:['Drama'])}
function projectCard(p){return `<article class="card"><div class="meta">${esc(projectGenres(p).join(' · '))} · ${dateLabel(p.updated||p.created)}</div><h4>${esc(p.title)}</h4><p>${esc(p.logline||'No logline yet.')}</p><div class="card-actions"><button class="secondary" onclick="openProject('${p.id}')">Open</button><button class="ghost" onclick="deleteProject('${p.id}')">Delete</button></div></article>`}
function setPage(next){page=next;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
function render(){
 const main=$('#main');
 if(page==='home'){
  main.innerHTML=`<section class="hero"><div class="eyebrow">Your story. Your studio.</div><h2>Turn a wild idea into a drama universe.</h2><p>Plan stories, build characters, outline episodes, and prepare scenes for AI video tools—all from your phone.</p><div class="actions"><button class="primary" onclick="setPage('create')">＋ Create a drama</button><button class="secondary" onclick="setPage('projects')">View projects</button></div></section>
  <div class="stats"><div class="stat"><strong>${projects.length}</strong><span>Projects</span></div><div class="stat"><strong>${projects.reduce((n,p)=>n+(p.characters||[]).length,0)}</strong><span>Characters</span></div><div class="stat"><strong>${projects.reduce((n,p)=>n+(p.episodes||[]).length,0)}</strong><span>Episodes</span></div></div>
  <div class="section-head"><h3>Recent projects</h3><small>${projects.length?'Saved on this device':'Start your first story'}</small></div>
  ${projects.length?`<div class="grid">${projects.slice().sort((a,b)=>(b.updated||b.created)-(a.updated||a.created)).slice(0,4).map(projectCard).join('')}</div>`:`<div class="empty"><b>Your studio is empty—for now.</b>Create a drama project to start building its world.</div>`}
  <div class="section-head"><h3>What this prototype can do</h3></div><div class="grid"><div class="card"><h4>✦ Story starters</h4><p>Turn a premise into a structured starter outline.</p></div><div class="card"><h4>♙ Character bible</h4><p>Save names, goals, secrets, and relationships.</p></div><div class="card"><h4>▤ Episode planner</h4><p>Draft episode beats and cliffhangers.</p></div></div>`;
 }else if(page==='projects'){
  main.innerHTML=`<div class="section-head"><h3>Your projects</h3><button class="primary" onclick="setPage('create')">＋ New</button></div>${projects.length?`<div class="grid">${projects.map(projectCard).join('')}</div>`:`<div class="empty"><b>No projects yet</b>Start a new drama and it will appear here.</div>`}`;
 }else if(page==='create'){
  main.innerHTML=`<div class="section-head"><h3>Create a drama</h3><small>Step 1 of your production pipeline</small></div><div class="notice warning">This first version creates and saves a structured draft locally. Live AI generation will be connected in a later version.</div><br>
  <form id="createForm"><div class="field"><label for="title">Drama title</label><input id="title" required maxlength="80" placeholder="e.g. The Heir's Last Secret"></div>
  <div class="field"><label for="premise">Your idea / premise</label><textarea id="premise" required maxlength="2000" placeholder="A disgraced heir returns to a city that believes them dead..."></textarea></div>
  <div class="field"><label>Genres — select as many as you like</label>${genrePickerMarkup("createGenre",["Romance"],"Romance")}</div><div class="field"><label for="mood">Tone</label><select id="mood">${moods.map(x=>`<option>${x}</option>`).join('')}</select></div>
  <div class="two"><div class="field"><label for="episodes">Initial episode count (1–1,000)</label><input id="episodes" type="number" min="1" max="1000" value="12" required></div><div class="field"><label for="seasonMode">Organization</label><select id="seasonMode"><option value="none">Continuous series</option><option value="seasons">Organize into seasons</option></select></div></div><div class="field"><label for="length">Episode length</label><select id="length"><option value="30–60 seconds">30–60 seconds</option><option value="1–3 minutes">1–3 minutes</option><option value="3–5 minutes">3–5 minutes</option><option value="10+ minutes">10+ minutes</option></select></div>
  <button class="primary" type="submit">✦ Generate starter pack</button></form>`;
  $('#createForm').addEventListener('submit',createProject);bindGenrePicker('createGenre');
 }else if(page==='bible'){
 main.innerHTML=`<div class="section-head"><h3>Story Bible</h3><small>Worldbuilding & canon</small></div>
 ${projects.length?`<div class="field"><label>Choose a project</label><select id="bibleProject">${projects.map(p=>`<option value="${esc(p.id)}">${esc(p.title)}</option>`).join('')}</select></div>
 <div class="actions"><button class="primary" onclick="openBible($('#bibleProject').value)">Open Story Bible</button><button class="secondary" onclick="exportBible($('#bibleProject').value)">Export Bible JSON</button></div>`:
 `<div class="empty"><b>Create a project first</b>Each project has its own Story Bible.</div>`}`;
 }else if(page==='library'){
  main.innerHTML=`<div class="section-head"><h3>Creative library</h3><small>Reusable writing tools</small></div><div class="grid">
  <div class="card"><div class="meta">PROMPT TOOL</div><h4>Drama premise expander</h4><p>Use a simple structure to strengthen an idea.</p><div class="card-actions"><button class="secondary" onclick="showPrompt('premise')">Open tool</button></div></div>
  <div class="card"><div class="meta">PROMPT TOOL</div><h4>Character builder</h4><p>Build a character with a want, need, flaw, secret, and arc.</p><div class="card-actions"><button class="secondary" onclick="showPrompt('character')">Open tool</button></div></div>
  <div class="card"><div class="meta">PROMPT TOOL</div><h4>Cliffhanger builder</h4><p>End an episode with a reveal, reversal, or urgent choice.</p><div class="card-actions"><button class="secondary" onclick="showPrompt('cliffhanger')">Open tool</button></div></div>
  <div class="card"><div class="meta">EXPORT</div><h4>Export project data</h4><p>Download a JSON backup of your projects.</p><div class="card-actions"><button class="secondary" onclick="exportData()">Export JSON</button></div></div>
  <div class="card"><div class="meta">IMPORT</div><h4>Restore a backup</h4><p>Load a previous DramaForge JSON backup.</p><div class="card-actions"><button class="secondary" onclick="$('#importFile').click()">Choose file</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(event)"></div></div>
  <div class="card"><div class="meta">RESET</div><h4>Clear local projects</h4><p>This removes projects stored in this browser.</p><div class="card-actions"><button class="danger" onclick="clearData()">Clear data</button></div></div>
  </div>`;
 }
}

const bibleTypes={characters:'Character profiles',locations:'Locations',factions:'Factions & organizations',lore:'Lore & world rules',relationships:'Relationships',timeline:'Timeline events'};
function bibleFor(p){ensureProjectShape(p);return p.bible}
function openBible(id){
 const p=projects.find(x=>x.id===id);if(!p)return;activeProject=id;
 const b=bibleFor(p);
 const groups=Object.keys(bibleTypes).map(k=>`<section class="card" style="margin:10px 0">
 <div class="section-head"><h3>${bibleTypes[k]} (${b[k].length})</h3><button class="secondary" onclick="addBibleEntry('${id}','${k}')">＋ Add</button></div>
 ${b[k].length?b[k].map((e,i)=>`<div class="bible-entry"><div class="season-head"><h4>${esc(e.name||'Untitled')}</h4><div class="mini-actions"><button class="ghost" onclick="editBibleEntry('${id}','${k}',${i})">Edit</button><button class="danger" onclick="deleteBibleEntry('${id}','${k}',${i})">Delete</button></div></div><p>${esc(e.details||'')}</p>${k==='timeline'&&e.date?`<p><b>Date / era:</b> ${esc(e.date)}</p>`:''}</div>`).join(''):'<p class="muted">Nothing added yet.</p>'}</section>`).join('');
 showModal('Story Bible · '+p.title,`<div class="field"><label>Universe / project overview</label><textarea id="bibleOverview" placeholder="Describe the world, premise, themes, and scope...">${esc(b.overview||'')}</textarea></div>
 <div class="field"><label>Non-negotiable canon rules</label><textarea id="bibleCanon" placeholder="Facts the story must never contradict...">${esc(b.canonRules||'')}</textarea></div>
 <div class="actions"><button class="primary" onclick="saveBibleOverview('${id}')">Save overview</button><button class="secondary" onclick="exportBible('${id}')">Export Story Bible JSON</button></div>${groups}`);
}
function saveBibleOverview(id){const p=projects.find(x=>x.id===id);if(!p)return;const b=bibleFor(p);b.overview=$('#bibleOverview').value.trim();b.canonRules=$('#bibleCanon').value.trim();p.updated=Date.now();save();openBible(id)}
function addBibleEntry(id,type){
 const p=projects.find(x=>x.id===id);if(!p||!bibleTypes[type])return;
 const label=type==='timeline'?'Event title':type==='characters'?'Character name':'Name / title';
 showModal('Add '+bibleTypes[type],`<form id="bibleEntryForm"><div class="field"><label>${label}</label><input id="bibleName" required maxlength="120" placeholder="${label}"></div>
 ${type==='timeline'?`<div class="field"><label>Chronological date / era</label><input id="bibleDate" placeholder="e.g. Year 120, Third Age"></div>`:''}
 <div class="field"><label>Details</label><textarea id="bibleDetails" required placeholder="${type==='characters'?'Age, appearance, personality, backstory, motivation, flaws, secrets, character arc, relationships...':'Write established facts and useful details...'}"></textarea></div><button class="primary" type="submit">Save entry</button></form>`);
 $('#bibleEntryForm').addEventListener('submit',e=>{e.preventDefault();const b=bibleFor(p);const entry={id:'bible-'+Date.now(),name:$('#bibleName').value.trim(),details:$('#bibleDetails').value.trim()};if(type==='timeline')entry.date=$('#bibleDate').value.trim();b[type].push(entry);p.updated=Date.now();save();openBible(id)});
}
function editBibleEntry(id,type,i){
 const p=projects.find(x=>x.id===id),entry=p?.bible?.[type]?.[i];if(!p||!entry)return;
 showModal('Edit '+(bibleTypes[type]||'entry'),`<form id="bibleEntryForm"><div class="field"><label>Name / title</label><input id="bibleName" required value="${esc(entry.name||'')}"></div>
 ${type==='timeline'?`<div class="field"><label>Date / era</label><input id="bibleDate" value="${esc(entry.date||'')}"></div>`:''}
 <div class="field"><label>Details</label><textarea id="bibleDetails" required>${esc(entry.details||'')}</textarea></div><button class="primary" type="submit">Save changes</button></form>`);
 $('#bibleEntryForm').addEventListener('submit',e=>{e.preventDefault();entry.name=$('#bibleName').value.trim();entry.details=$('#bibleDetails').value.trim();if(type==='timeline')entry.date=$('#bibleDate').value.trim();p.updated=Date.now();save();openBible(id)});
}
function deleteBibleEntry(id,type,i){const p=projects.find(x=>x.id===id);if(!p||!confirm('Delete this Story Bible entry?'))return;p.bible[type].splice(i,1);p.updated=Date.now();save();openBible(id)}
function exportBible(id){const p=projects.find(x=>x.id===id);if(!p)return;download(`${safeName(p.title)}-story-bible.json`,JSON.stringify({title:p.title,bible:bibleFor(p)},null,2),'application/json')}

function createProject(e){
 e.preventDefault();
 const title=$('#title').value.trim(), premise=$('#premise').value.trim(), selection=getGenreSelection('createGenre'), genre=selection.primary, mood=$('#mood').value, count=Number($('#episodes').value), length=$('#length').value;
 if(!selection.selected.length){alert('Choose at least one genre.');return}
 if(!Number.isInteger(count)||count<1||count>1000){alert('Choose between 1 and 1,000 episodes.');return}
 const useSeasons=$('#seasonMode').value==='seasons';
 const p={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,premise,genre,genres:selection.selected,primaryGenre:selection.primary,mood,count,length,created:Date.now(),updated:Date.now(),logline:premise.slice(0,150),characters:[],seasonMode:useSeasons?'seasons':'none',seasons:useSeasons?[{id:'season-1',name:'Season 1',summary:''}]:[],episodes:[]};
 for(let i=1;i<=count;i++)p.episodes.push({id:'ep-'+i+'-'+Date.now(),title:episodeTitle(i,genre),note:'',summary:'',status:'Draft',characterIds:[],continuityNotes:'',plotThreads:'',seasonId:useSeasons?'season-1':null});
 p.story=makeStory(p);projects.unshift(p);save();activeProject=p.id;openProject(p.id);
}
function makeStory(p){
 const n=p.count;
 const hooks=[
 'A discovery makes the protagonist question everything they believe.',
 'An ally reveals a hidden motive, changing the balance of power.',
 'The protagonist wins publicly but loses something deeply personal.',
 'A secret from the past threatens to destroy a fragile alliance.',
 'A seemingly minor character reveals unexpected influence.',
 'The antagonist offers a deal that could solve one problem and create a worse one.',
 'A betrayal forces the protagonist to choose between love and survival.',
 'Evidence points toward the wrong person—until one detail changes everything.',
 'The protagonist discovers the conflict is larger than they imagined.',
 'A final revelation reframes the opening scene and launches the next chapter.'
 ];
 let out=`${p.title.toUpperCase()} — STARTER STORY PACK\n\nPRIMARY GENRE: ${p.primaryGenre||p.genre}\nGENRE COMBINATION: ${projectGenres(p).join(' + ')}\nTONE: ${p.mood}\nFORMAT: ${n} episodes · ${p.length} each\n\nCORE PREMISE\n${p.premise}\n\nSERIES ENGINE\nEach episode should move the central conflict forward, reveal a new piece of character information, and end on a strong emotional or plot question. Keep the main characters' goals and visual traits consistent.\n\nEPISODE OUTLINE\n`;
 for(let i=1;i<=n;i++){let hook=hooks[(i-1)%hooks.length];out+=`\nEPISODE ${i}: ${episodeTitle(i,p.primaryGenre||p.genre)}\n• Opening hook: Start with a striking image, urgent decision, or unanswered question.\n• Escalation: The premise creates a concrete obstacle for the protagonist.\n• Character beat: Reveal a desire, fear, contradiction, or relationship shift.\n• Turn: ${hook}\n• Cliffhanger: End on a new danger, a revelation, or a choice that cannot be undone.\n`}
 out+=`\nVISUAL DIRECTION\n• Aspect ratio: 9:16 vertical for mobile-first drama.\n• Use readable close-ups, clear eyelines, simple geography, and motivated camera moves.\n• Repeat character descriptions and wardrobe details in every visual prompt to improve consistency.\n• Keep dialogue concise and let reaction shots carry emotional beats.\n\nNEXT STEP\nAdd your main characters in the project editor, then expand each episode into 3–8 individual scenes. This is a template-based starter draft; connect a language model for truly customized AI-written material.`;
 return out;
}
function episodeTitle(i,g){const titles=['The Unexpected Return','A Promise in the Dark','The Price of Trust','A Door Left Open','The Hidden Witness','A Dangerous Offer','Blood and Secrets','The False Victory','No Way Back','The Truth Beneath'];return titles[(i-1)%titles.length]}
function ensureProjectShape(p){
 if(!Array.isArray(p.episodes))p.episodes=[];
 if(!Array.isArray(p.characters))p.characters=[];
 p.characters=p.characters.map((c,i)=>({...c,id:c.id||'char-'+i}));
 if(!Array.isArray(p.seasons))p.seasons=[];
 if(!p.bible||typeof p.bible!=='object')p.bible={overview:'',canonRules:'',characters:[],locations:[],factions:[],lore:[],relationships:[],timeline:[]};
 ['characters','locations','factions','lore','relationships','timeline'].forEach(k=>{if(!Array.isArray(p.bible[k]))p.bible[k]=[]});
 p.episodes=p.episodes.map((ep,i)=>({...ep,id:ep.id||'ep-'+i+'-'+(p.id||'x'),title:ep.title||`Episode ${i+1}`,note:ep.note||'',summary:ep.summary||'',status:ep.status||'Draft',characterIds:Array.isArray(ep.characterIds)?ep.characterIds:[],continuityNotes:ep.continuityNotes||'',plotThreads:ep.plotThreads||'',seasonId:ep.seasonId||null}));
 const planned=Math.min(1000,Math.max(0,Number(p.count)||0));
 while(p.episodes.length<planned){const i=p.episodes.length;p.episodes.push({id:'ep-'+i+'-'+(p.id||'x'),title:episodeTitle(i+1,p.primaryGenre||p.genre),note:'',summary:'',status:'Draft',characterIds:[],continuityNotes:'',plotThreads:'',seasonId:null})}
 p.count=Math.max(planned,p.episodes.length);
}
function openProject(id){
 const p=projects.find(x=>x.id===id);if(!p)return;if(activeProject!==id)episodeLimit=50;ensureProjectShape(p);activeProject=id;
 const existingGenres=projectGenres(p), primary=p.primaryGenre||p.genre||existingGenres[0];
 const seasonOptions=(p.seasons||[]).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
 const seasonPanel=p.seasonMode==='seasons'?`<div class="section-head"><h3>Seasons (${p.seasons.length})</h3><button class="secondary" onclick="addSeason('${p.id}')">＋ Season</button></div>${p.seasons.map((s,i)=>`<div class="card" style="margin-bottom:8px"><div class="season-head"><h4>${esc(s.name)}</h4><div class="mini-actions"><button class="ghost" onclick="editSeason('${p.id}','${s.id}')">Edit</button><button class="ghost" onclick="exportSeason('${p.id}','${s.id}')">Export season</button></div></div><p>${esc(s.summary||'No season summary yet.')}</p><div class="muted">${p.episodes.filter(e=>e.seasonId===s.id).length} episodes</div></div>`).join('')}`:'';
 const grouped=p.episodes.slice(0,episodeLimit).map((ep,i)=>({ep,i}));
 showModal(p.title,`<div class="meta">${esc(existingGenres.join(' · '))} · ${p.episodes.length} episodes · ${esc(p.length)}</div>
 <div class="field"><label>Premise</label><textarea id="editPremise">${esc(p.premise)}</textarea></div><div class="field"><label>Genres — unlimited selections</label>${genrePickerMarkup("editGenre",existingGenres,primary)}</div><div class="field"><label for="editMood">Tone</label><select id="editMood">${moods.map(x=>`<option ${x===p.mood?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="actions" style="margin:13px 0"><button class="primary" onclick="saveProjectEdits('${p.id}')">Save details</button><button class="secondary" onclick="showStory('${p.id}')">View story pack</button><button class="secondary" onclick="openBible('${p.id}')">Story Bible</button><button class="secondary" onclick="addCharacter('${p.id}')">＋ Character</button><button class="ghost" onclick="downloadStory('${p.id}')">Export series .txt</button><button class="ghost" onclick="exportProjectJSON('${p.id}')">Export project JSON</button></div>
 ${seasonPanel}
 <div class="section-head"><h3>Episode planner (${p.episodes.length}/1,000)</h3><button class="secondary" onclick="addEpisode('${p.id}')">＋ Episode</button></div>
 <div class="two"><div class="field"><label for="bulkCount">Bulk-create episodes</label><input id="bulkCount" type="number" min="1" max="1000" value="10"></div><div class="field"><label for="bulkSeason">Assign new episodes to</label><select id="bulkSeason"><option value="">No season</option>${seasonOptions}</select></div></div><button class="secondary" onclick="bulkAddEpisodes('${p.id}')">＋ Create batch</button>
 ${grouped.length?grouped.map(({ep,i})=>`<div class="card" style="margin:9px 0"><div class="episode-row"><div class="ep-main"><div class="meta">EPISODE ${i+1} · ${esc(ep.status)}${ep.seasonId?' · '+esc((p.seasons.find(s=>s.id===ep.seasonId)||{}).name||'Season'):''}</div><h4>${esc(ep.title)}</h4><p>${esc(ep.summary||ep.note||'No summary or notes yet.')}</p><div class="mini-actions"><button class="secondary" onclick="editEpisode('${p.id}','${ep.id}')">Edit</button><button class="ghost" onclick="duplicateEpisode('${p.id}','${ep.id}')">Duplicate</button><button class="ghost" onclick="moveEpisode('${p.id}','${ep.id}',-1)" ${i===0?'disabled':''}>↑</button><button class="ghost" onclick="moveEpisode('${p.id}','${ep.id}',1)" ${i===p.episodes.length-1?'disabled':''}>↓</button><button class="danger" onclick="deleteEpisode('${p.id}','${ep.id}')">Delete</button></div></div></div></div>`).join(''):'<div class="empty"><b>No episodes yet</b>Add an episode or create a batch.</div>'}${p.episodes.length>episodeLimit?`<button class="secondary" style="width:100%;margin:8px 0" onclick="showMoreEpisodes('${p.id}')">Show next 50 episodes (${p.episodes.length-episodeLimit} remaining)</button>`:''}
 <div class="section-head"><h3>Characters (${p.characters.length})</h3><button class="secondary" onclick="addCharacter('${p.id}')">＋ Character</button></div>${p.characters.length?p.characters.map((c,i)=>`<div class="card" style="margin-bottom:8px"><h4>${esc(c.name)}</h4><p>${esc(c.description)}</p><span class="tag">${esc(c.role||'Character')}</span><button class="ghost" style="float:right;padding:5px 8px" onclick="removeCharacter('${p.id}',${i})">Remove</button></div>`).join(''):'<p class="muted">No characters yet. Add your first character.</p>'}`);
 bindGenrePicker('editGenre');
}
function saveProjectEdits(id){const p=projects.find(x=>x.id===id);if(!p)return;const selection=getGenreSelection('editGenre');if(!selection.selected.length){alert('Choose at least one genre.');return}p.premise=$('#editPremise').value.trim();p.logline=p.premise.slice(0,150);p.genres=selection.selected;p.primaryGenre=selection.primary;p.genre=selection.primary;p.mood=$('#editMood').value;p.updated=Date.now();p.story=makeStory(p);save();openProject(id)}
function showStory(id){const p=projects.find(x=>x.id===id);if(!p)return;showModal('Story pack',`<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="downloadStory('${id}')">Download .txt</button><button class="secondary" onclick="copyText('${id}')">Copy text</button></div><div class="output">${esc(p.story||makeStory(p))}</div>`)}
function addCharacter(id){const p=projects.find(x=>x.id===id);if(!p)return;showModal('Add character',`<form id="charForm"><div class="field"><label>Name</label><input id="charName" required maxlength="80" placeholder="Character name"></div><div class="field"><label>Role</label><select id="charRole"><option>Protagonist</option><option>Antagonist</option><option>Love interest</option><option>Ally</option><option>Rival</option><option>Supporting character</option></select></div><div class="field"><label>Description, goal, secret, or visual traits</label><textarea id="charDesc" required placeholder="What do they want? What are they hiding? What do they look like?"></textarea></div><button class="primary" type="submit">Save character</button></form>`);$('#charForm').addEventListener('submit',e=>{e.preventDefault();p.characters.push({id:'char-'+Date.now(),name:$('#charName').value.trim(),role:$('#charRole').value,description:$('#charDesc').value.trim()});p.updated=Date.now();save();openProject(id)})}
function showMoreEpisodes(id){episodeLimit+=50;openProject(id)}
function addEpisode(id){const p=projects.find(x=>x.id===id);if(!p)return;ensureProjectShape(p);if(p.episodes.length>=1000){alert('This project has reached the 1,000 episode limit.');return}const season=p.seasons[0]?.id||'';p.episodes.push({id:'ep-'+Date.now(),title:`Episode ${p.episodes.length+1}`,note:'',summary:'',status:'Draft',characterIds:[],continuityNotes:'',plotThreads:'',seasonId:season||null});p.count=p.episodes.length;p.updated=Date.now();save();openProject(id)}
function bulkAddEpisodes(id){const p=projects.find(x=>x.id===id);if(!p)return;ensureProjectShape(p);const n=Number($('#bulkCount').value),seasonId=$('#bulkSeason').value||null;if(!Number.isInteger(n)||n<1||n>1000||p.episodes.length+n>1000){alert(`Enter a batch from 1 to ${Math.min(1000,1000-p.episodes.length)} episodes.`);return}const start=p.episodes.length;for(let i=1;i<=n;i++)p.episodes.push({id:'ep-'+(Date.now()+i),title:`Episode ${start+i}`,note:'',summary:'',status:'Draft',characterIds:[],continuityNotes:'',plotThreads:'',seasonId});p.count=p.episodes.length;p.updated=Date.now();save();openProject(id)}
function editEpisode(id,eid){const p=projects.find(x=>x.id===id),ep=p?.episodes.find(x=>x.id===eid);if(!p||!ep)return;const chars=p.characters.map(c=>`<label class="genre-option"><input type="checkbox" class="epChar" value="${esc(c.id||c.name)}" ${(ep.characterIds||[]).includes(c.id||c.name)?'checked':''}>${esc(c.name)}</label>`).join('');const seasons=(p.seasons||[]).map(s=>`<option value="${esc(s.id)}" ${ep.seasonId===s.id?'selected':''}>${esc(s.name)}</option>`).join('');showModal('Edit episode',`<form id="episodeEditForm"><div class="field"><label>Episode title</label><input id="epEditTitle" maxlength="120" required value="${esc(ep.title)}"></div><div class="field"><label>Status</label><select id="epEditStatus">${['Draft','In Progress','Completed'].map(x=>`<option ${ep.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Season</label><select id="epEditSeason"><option value="">No season</option>${seasons}</select></div><div class="field"><label>Episode summary</label><textarea id="epEditSummary">${esc(ep.summary)}</textarea></div><div class="field"><label>Episode notes / scene beats</label><textarea id="epEditNote">${esc(ep.note)}</textarea></div><div class="field"><label>Characters appearing</label><div class="genre-list">${chars||'<span class="muted">Add characters to this project first.</span>'}</div></div><div class="field"><label>Continuity notes</label><textarea id="epEditContinuity" placeholder="Facts, props, injuries, promises, dates, or rules that must stay consistent.">${esc(ep.continuityNotes)}</textarea></div><div class="field"><label>Plot threads / unresolved questions</label><textarea id="epEditThreads" placeholder="Mysteries, cliffhangers, conflicts, or promises to revisit.">${esc(ep.plotThreads)}</textarea></div><button class="primary" type="submit">Save episode</button></form>`);$('#episodeEditForm').addEventListener('submit',e=>{e.preventDefault();ep.title=$('#epEditTitle').value.trim();ep.status=$('#epEditStatus').value;ep.seasonId=$('#epEditSeason').value||null;ep.summary=$('#epEditSummary').value.trim();ep.note=$('#epEditNote').value.trim();ep.characterIds=[...document.querySelectorAll('.epChar:checked')].map(x=>x.value);ep.continuityNotes=$('#epEditContinuity').value.trim();ep.plotThreads=$('#epEditThreads').value.trim();p.updated=Date.now();save();openProject(id)})}
function duplicateEpisode(id,eid){const p=projects.find(x=>x.id===id),ep=p?.episodes.find(x=>x.id===eid);if(!p||!ep)return;if(p.episodes.length>=1000){alert('This project has reached the 1,000 episode limit.');return}const copy=JSON.parse(JSON.stringify(ep));copy.id='ep-'+Date.now();copy.title=ep.title+' (Copy)';copy.status='Draft';p.episodes.splice(p.episodes.indexOf(ep)+1,0,copy);p.count=p.episodes.length;p.updated=Date.now();save();openProject(id)}
function moveEpisode(id,eid,dir){const p=projects.find(x=>x.id===id);if(!p)return;const i=p.episodes.findIndex(x=>x.id===eid),j=i+dir;if(i<0||j<0||j>=p.episodes.length)return;[p.episodes[i],p.episodes[j]]=[p.episodes[j],p.episodes[i]];p.updated=Date.now();save();openProject(id)}
function deleteEpisode(id,eid){const p=projects.find(x=>x.id===id);if(!p||!confirm('Delete this episode?'))return;p.episodes=p.episodes.filter(x=>x.id!==eid);p.count=p.episodes.length;p.updated=Date.now();save();openProject(id)}
function addSeason(id){const p=projects.find(x=>x.id===id);if(!p)return;if(p.seasonMode!=='seasons')p.seasonMode='seasons';const n=p.seasons.length+1;p.seasons.push({id:'season-'+Date.now(),name:'Season '+n,summary:''});p.updated=Date.now();save();openProject(id)}
function editSeason(id,sid){const p=projects.find(x=>x.id===id),s=p?.seasons.find(x=>x.id===sid);if(!p||!s)return;showModal('Edit season',`<form id="seasonForm"><div class="field"><label>Season name</label><input id="seasonName" required value="${esc(s.name)}"></div><div class="field"><label>Season summary</label><textarea id="seasonSummary" placeholder="Major events, character changes, central conflict, finale.">${esc(s.summary||'')}</textarea></div><button class="primary" type="submit">Save season</button></form>`);$('#seasonForm').addEventListener('submit',e=>{e.preventDefault();s.name=$('#seasonName').value.trim();s.summary=$('#seasonSummary').value.trim();p.updated=Date.now();save();openProject(id)})}
function exportProjectJSON(id){const p=projects.find(x=>x.id===id);if(p)download(`${safeName(p.title)}-backup.json`,JSON.stringify(p,null,2),'application/json')}
function exportSeason(id,sid){const p=projects.find(x=>x.id===id);if(!p)return;const s=p.seasons.find(x=>x.id===sid);if(!s)return;download(`${safeName(p.title)}-${safeName(s.name)}.txt`,formatEpisodes(p,p.episodes.filter(e=>e.seasonId===sid),s.name),'text/plain;charset=utf-8')}
function formatEpisodes(p,eps,label='Complete Series'){return `${p.title} — ${label}\nGenres: ${projectGenres(p).join(' + ')}\nPremise: ${p.premise}\n\n`+eps.map((e,i)=>`EPISODE ${i+1}: ${e.title}\nStatus: ${e.status}\nSummary: ${e.summary||''}\nNotes: ${e.note||''}\nCharacters: ${(e.characterIds||[]).map(cid=>p.characters.find(c=>(c.id||c.name)===cid)?.name||cid).join(', ')}\nContinuity: ${e.continuityNotes||''}\nPlot threads: ${e.plotThreads||''}\n`).join('\n')}
function removeCharacter(id,i){const p=projects.find(x=>x.id===id);if(!p)return;p.characters.splice(i,1);save();openProject(id)}
function deleteProject(id){if(!confirm('Delete this project from this device?'))return;projects=projects.filter(p=>p.id!==id);save();render()}
function showPrompt(type){
 const data={
 premise:['Premise expander','Take this premise and expand it into: (1) a one-sentence logline, (2) protagonist and goal, (3) central conflict, (4) antagonist pressure, (5) emotional stakes, (6) 3 escalating twists, and (7) a season-ending reveal. Keep the original idea recognizable.'],
 character:['Character builder','Create a layered drama character. Include: name, role, visual design, public mask, private desire, greatest fear, flaw, secret, relationship tensions, moral boundary, and how they change over the season. Avoid making every trait fit neatly together; give them contradictions.'],
 cliffhanger:['Cliffhanger builder','Write 10 distinct cliffhangers for the episode described by the user: a shocking revelation, sudden reversal, urgent danger, emotional confession, betrayal, impossible choice, identity reveal, apparent death, interrupted action, and a quiet but unsettling discovery. Make each cliffhanger feel earned.']
 }[type];
 showModal(data[0],`<div class="output" id="promptText">${esc(data[1])}</div><div class="actions" style="margin-top:12px"><button class="primary" onclick="copyPrompt('${type}')">Copy prompt</button></div><p style="color:var(--muted);font-size:12px;margin-top:12px">Paste this into an AI writing tool when you want a richer draft. Live AI is not connected in this prototype.</p>`)
}
function copyPrompt(type){const map={premise:'Expand this drama premise into a logline, protagonist, conflict, antagonist, stakes, 3 twists, and season-ending reveal. Preserve the core idea.',character:'Create a layered character with name, role, visual design, public mask, desire, fear, flaw, secret, relationships, moral boundary, and character arc.',cliffhanger:'Generate 10 earned cliffhangers for this episode: revelation, reversal, danger, confession, betrayal, impossible choice, identity reveal, apparent death, interrupted action, unsettling discovery.'};copyToClipboard(map[type])}
function copyText(id){const p=projects.find(x=>x.id===id);if(p)copyToClipboard(p.story||makeStory(p))}
function copyToClipboard(s){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>alert('Copied to clipboard.')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}
function fallbackCopy(s){const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();try{document.execCommand('copy');alert('Copied to clipboard.')}catch(e){alert('Copy unavailable. Use Export .txt instead.')}t.remove()}
function downloadStory(id){const p=projects.find(x=>x.id===id);if(!p)return;ensureProjectShape(p);const text=(p.story||makeStory(p))+'\n\n'+formatEpisodes(p,p.episodes);download(`${safeName(p.title)}-series.txt`,text,'text/plain;charset=utf-8')}
function safeName(s){return (s||'drama').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45)||'drama'}
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportData(){download('dramaforge-backup.json',JSON.stringify(projects,null,2),'application/json')}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw Error();projects=d;save();render();alert('Backup restored.')}catch(err){alert('That file is not a valid DramaForge backup.')}};r.readAsText(f)}
function clearData(){if(!confirm('Permanently clear all DramaForge projects stored in this browser? Export a backup first if needed.'))return;projects=[];save();render()}
function showModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
$('#closeModal').addEventListener('click',closeModal);$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
